# version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-interview_notes}
    ports:
      - "5454:5432"  # Оставляем для доступа извне, убрать в продакшене
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interview_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-interview_notes}
      PYTHONUNBUFFERED: 1
    expose:
      - "8888"  # Делаем порт доступным только внутри сети
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interview_network
    volumes:
      - .:/app
    command: uvicorn app.core.main:app --host 0.0.0.0 --port 8888 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend
    expose:
      - "5173"  # Делаем порт доступным только внутри сети
    networks:
      - interview_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api/v1
    command: yarn dev --host 0.0.0.0

  migrations:
    container_name: migrations
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-interview_notes}
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interview_network
    volumes:
      - .:/app
    command: |
      sh -c "
        # Ждем готовности базы
        until pg_isready -h db -p 5432; do
          echo 'Waiting for database...'
          sleep 2
        done
        
        # Создаем таблицу alembic_version если её нет
        PGPASSWORD=${DB_PASSWORD:-postgres} psql -h db -U ${DB_USER:-postgres} -d ${DB_NAME:-interview_notes} -c \"
          CREATE TABLE IF NOT EXISTS alembic_version (
            version_num VARCHAR(32) NOT NULL,
            CONSTRAINT alembic_version_pkc PRIMARY KEY (version_num)
          );
        \" || true
        
        # Запускаем миграции
        alembic upgrade head
      "

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"  # Для HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    networks:
      - interview_network

volumes:
  postgres_data:

networks:
  interview_network:
    driver: bridge