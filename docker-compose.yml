version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-interview_notes}
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interview_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-interview_notes}
      PYTHONUNBUFFERED: 1
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interview_network
    volumes:
      - .:/app
    command: uvicorn app.core.main:app --host 0.0.0.0 --port 8888 --reload

  # api_migrations:
  #   container_name: interview_notes_api_migrations
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: alembic upgrade head
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  postgres_data:

networks:
  interview_network:
    driver: bridge
