<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dev Interview Notes</title>
  <desc id="desc">A visual overview of the interview preparation platform.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#171A3A"/>
      <stop offset="1" stop-color="#24204A"/>
    </linearGradient>
    <linearGradient id="glow" x1="930" y1="40" x2="1150" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D5DFB"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="150" x2="480" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B8CFF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
